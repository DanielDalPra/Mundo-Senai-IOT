<text x="1260" y="1280" font-size="21" fill="#805014" font-weight="400" text-anchor="start">5 × 3,3 / (2,2 + 3,3) ≈ 3,0 V</text>
<text x="60" y="1394" font-size="22" fill="#176c61" font-weight="700" text-anchor="start">ANTES DE LIGAR</text>
<text x="60" y="1433" font-size="21" fill="#18313c" font-weight="400" text-anchor="start">1  USB fora enquanto liga os fios.</text>
