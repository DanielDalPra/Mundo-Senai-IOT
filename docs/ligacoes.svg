<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<style>text{font-family:Arial,sans-serif;fill:#203853}.title{font-size:26px;font-weight:bold}.small{font-size:17px}.head{font-size:21px;font-weight:bold}.wire{fill:none;stroke:#426b9e;stroke-width:3}.pin{font-size:18px}.note{font-size:16px;fill:#61758c}</style>
<rect width="1200" height="850" fill="#f5f8fc"/><text x="40" y="48" class="title">ESP32 · mapa de conexões</text><text x="40" y="77" class="note">Use os nomes dos terminais. Posição física dos pinos varia conforme a placa.</text>
<rect x="420" y="125" width="325" height="500" rx="20" fill="#18385f"/><text x="582" y="169" text-anchor="middle" style="font-size:26px;font-weight:bold;fill:white">ESP32 WROOM</text><text x="582" y="197" text-anchor="middle" style="font-size:17px;fill:#adcaed">DevKit clássico · USB</text>
<g style="font-size:18px;fill:white"><text x="450" y="246" style="fill:white">18 / 23 / 19</text><text x="450" y="278" style="fill:white">21 / 22</text><text x="450" y="366" style="fill:white">18 / 23</text><text x="450" y="398" style="fill:white">16 / 27</text><text x="570" y="246" style="fill:white">32 / 33 / 13 / 14</text><text x="570" y="278" style="fill:white">34 ← OUT</text><text x="570" y="366" style="fill:white">25 → TRIG</text><text x="570" y="398" style="fill:white">26 ← ECHO</text><text x="450" y="510" style="fill:white">3V3: RFID, OLED e cor</text><text x="450" y="548" style="fill:white">5 V: HC-SR04</text><text x="450" y="586" style="fill:white">GND comum a todos</text></g>
<rect x="40" y="125" width="320" height="180" rx="12" fill="#e2ecf9"/><text x="62" y="162" class="head">RC522 · RFID</text><text x="62" y="198" class="small">SCK 18 · MOSI 23 · MISO 19</text><text x="62" y="230" class="small">SDA/SS 21 · RST 22</text><text x="62" y="267" class="small">VCC 3V3 · GND · IRQ livre</text><path d="M360 245H420" class="wire"/>
<rect x="40" y="335" width="320" height="175" rx="12" fill="#e2ecf9"/><text x="62" y="372" class="head">OLED SPI · 6 pinos</text><text x="62" y="408" class="small">CLK 18 · MOSI 23</text><text x="62" y="440" class="small">CS 16 · D/C 27</text><text x="62" y="477" class="small">VCC 3V3 · GND · sem RESET</text><path d="M360 397H420" class="wire"/>
<rect x="800" y="125" width="360" height="180" rx="12" fill="#e2ecf9"/><text x="822" y="162" class="head">TCS3200 · Cor</text><text x="822" y="198" class="small">S0 32 · S1 33 · S2 13 · S3 14</text><text x="822" y="230" class="small">OUT 34 · LED 3V3*</text><text x="822" y="267" class="small">VCC 3V3 · GND</text><path d="M745 245H800" class="wire"/>
<rect x="800" y="335" width="360" height="175" rx="12" fill="#fff1d7"/><text x="822" y="372" class="head">HC-SR04 · Presença</text><text x="822" y="408" class="small">TRIG 25 · ECHO via divisor</text><text x="822" y="440" class="small">VCC 5 V · GND</text><text x="822" y="477" class="note">ECHO não pode ir direto ao GPIO!</text><path d="M745 397H800" class="wire"/>
<text x="40" y="565" class="note">SPI compartilhado: 18 e 23.</text><text x="40" y="591" class="note">CS separado para OLED e RFID.</text><text x="800" y="555" class="note">* Confira LED na placa fotografada.</text><text x="800" y="580" class="note">O módulo expõe LED, não OE.</text>
<rect x="40" y="662" width="1120" height="150" rx="12" fill="white" stroke="#d8e3f0"/><text x="62" y="698" class="head">Divisor do ECHO: 5 V → aproximadamente 3,0 V</text>
<text x="65" y="758" class="pin">ECHO</text><path d="M140 752H225M345 752H520M520 752H740M520 752V783" class="wire"/><rect x="225" y="738" width="120" height="28" fill="#fff0c3" stroke="#956d29" stroke-width="2"/><text x="285" y="730" text-anchor="middle" class="small">R1: 2,2 kΩ</text><circle cx="520" cy="752" r="5" fill="#285eac"/><text x="750" y="758" class="pin">GPIO26</text><rect x="550" y="770" width="120" height="28" fill="#fff0c3" stroke="#956d29" stroke-width="2"/><path d="M520 783H550M670 783H735" class="wire"/><text x="610" y="762" text-anchor="middle" class="small">R2: 3,3 kΩ</text><text x="750" y="789" class="pin">GND</text><text x="925" y="756" class="note">5 × 3,3 / 5,5</text><text x="925" y="783" class="note">= 3,0 V nominal</text>
</svg>
